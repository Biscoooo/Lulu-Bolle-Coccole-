name: Pubblica il sito su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Compila il sito
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installa le dipendenze
        run: npm ci
      - name: Compila React e Tailwind
        run: npm run build
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Carica il sito compilato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Pubblica su Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
